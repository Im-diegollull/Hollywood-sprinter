<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sprinter — Remake</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #101418;
        color: #e8eef3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      canvas { display: block; image-rendering: pixelated; }

      #debug {
        position: absolute; top: 12px; right: 12px;
        width: 260px; padding: 12px;
        background: rgba(16, 20, 24, 0.92);
        border: 1px solid #2a3440;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.5;
      }
      #debug.hidden { display: none; }
      #debug h2 { font-size: 11px; letter-spacing: 0.1em; color: #7fd1ff; margin-bottom: 8px; }
      #debug label { display: block; margin-bottom: 6px; color: #9fb0c0; }
      #debug .row { display: flex; justify-content: space-between; gap: 8px; }
      #debug input[type="range"] { width: 100%; accent-color: #7fd1ff; }
      #debug .val { color: #e8eef3; }
      #debug .hint { margin-top: 8px; color: #62727f; font-size: 10px; }
      #debug button {
        width: 100%; margin-top: 8px; padding: 5px;
        background: #1d2731; color: #9fb0c0;
        border: 1px solid #2a3440; border-radius: 4px;
        font: inherit; font-size: 10px; cursor: pointer;
      }
      #debug button:hover { background: #263340; color: #e8eef3; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="debug" class="hidden">
        <h2>CALIBRACIÓN [F2]</h2>
        <div id="debug-controls"></div>
        <button id="debug-reset">Restaurar valores</button>
        <div class="hint">Objetivo: 7.50 s alcanzable pero muy difícil.</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
